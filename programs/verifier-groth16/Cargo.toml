[package]
name = "ptf-verifier-groth16"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ptf_verifier_groth16"

[dependencies]
anchor-lang = { workspace = true }
sha3 = { workspace = true }
ptf-common = { path = "../common" }

[target.'cfg(not(target_arch = "bpf"))'.dependencies]
ark-bn254 = { version = "0.4", default-features = false, features = ["std", "curve"] }
ark-ec = { version = "0.4", default-features = false, features = ["std"] }
ark-ff = { version = "0.4", default-features = false, features = ["std"] }
ark-groth16 = { version = "0.4", default-features = false, features = ["std"] }
ark-relations = { version = "0.4", default-features = false, features = ["std"] }
ark-serialize = { version = "0.4", default-features = false, features = ["std", "derive"] }
ark-std = { version = "0.4", default-features = false, features = ["std"] }
ark-snark = { version = "0.4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# NOTE: groth16-syscall requires Solana runtime support for sol_groth16_verify syscall
# The syscall IS available on mainnet (Solana 1.18.x+) but NOT in local validator
# 
# For PRODUCTION (mainnet/testnet): Use groth16-syscall feature
#   anchor build --features groth16-syscall
#   This enables full security and decentralization
#
# For LOCAL DEVELOPMENT: Use groth16-dev-skip feature (default)
#   anchor build  (uses dev-skip by default)
#   This bypasses verification for local testing only
#
# IMPORTANT: Always deploy to mainnet with groth16-syscall enabled!
default = ["groth16-dev-skip"]
groth16-syscall = []
groth16-dev-skip = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
idl-build = ["no-entrypoint", "anchor-lang/idl-build"]
anchor-debug = []
no-log-ix-name = []
custom-heap = []
custom-panic = []
solana = []
lightweight = []
